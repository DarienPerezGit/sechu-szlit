name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sechub
          POSTGRES_PASSWORD: sechub
          POSTGRES_DB: sechub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sechub -d sechub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://sechub:sechub@127.0.0.1:5432/sechub
      TEST_DATABASE_URL: postgresql://sechub:sechub@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
