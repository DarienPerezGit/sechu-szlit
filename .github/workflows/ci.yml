name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres_version: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}-alpine
        env:
          POSTGRES_USER: sechub
          POSTGRES_PASSWORD: sechub
          POSTGRES_DB: sechub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sechub -d sechub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://sechub:sechub@127.0.0.1:5432/sechub
      TEST_DATABASE_URL: postgresql://sechub:sechub@127.0.0.1:5432/postgres
      EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - if: matrix.postgres_version == 18
        run: pnpm test
      - if: matrix.postgres_version == 17
        run: pnpm --filter db exec vitest run tests/migrate.test.ts --testNamePattern "runMigrations UUIDv7 compatibility"
